services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casino_portal
      POSTGRES_USER: casino_app
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - casino_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_app -d casino_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casino_postgres_data:
